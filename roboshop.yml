- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: "sg-080072874ce068822"
    ami_id: "ami-0220d79f3f480ecf5"
    env: "dev"
    instances:
    - mongodb
     - catalogue
  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        name: "{{ item }}-{{ env }}"
        instance_type: t3.micro
        image_id: "{{ ami_id }}"
        security_groups: "{{ sg_id }}"
       
        tags:
          Project: roboshop
          Component: "{{ item }}"
          env: "{{ env }}"
          Name: "{{ item }}-{{ env }}"

      loop: "{{ instances }}"
      
      register: ec2_output

    - name: print the output
      ansible.builtin.debug:
        msg: "{{ ec2_output }}"

