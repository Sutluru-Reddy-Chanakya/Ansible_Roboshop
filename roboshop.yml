- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: "sg-080072874ce068822"
    ami_id: "ami-0220d79f3f480ecf5"
    domain_name: "cineniti.in"
    env: "dev"
    instances:
    - frontend
    - mongodb
    - catalogue
  
  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        name: "{{ item }}-{{ env }}"
        instance_type: t3.micro
        image_id: "{{ ami_id }}"
        security_groups: "{{ sg_id }}"
       
        tags:
          Project: roboshop
          Component: "{{ item }}"
          env: "{{ env }}"
          Name: "Roboshop-{{ item }}-{{ env }}"

      loop: "{{ instances }}"
      
      register: ec2_output

    - name: print the output
      ansible.builtin.debug:
        msg: "{{ ec2_output }}"

    - name: create r53 record
      amazon.aws.route53:
        zone: "{{ domain_name }}"
        state: present
        record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address}}"
      loop: "{{ ec2_output.results }}"

    - name: create r53 record
      amazon.aws.route53:
        zone: "{{ domain_name }}"
        state: present
        record: "roboshop-{{ env }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address}}"
      when: item.item == "frontend"


      loop: "{{ ec2_output.results }}"